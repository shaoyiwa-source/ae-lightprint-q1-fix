<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="ae-version" content="lp-demo-q1-affordance-v3">
<title>Dream Giver · 三問到人物</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Noto+Serif+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#f7f1e8;--ink:#2a2420;--muted:#7a6f64;--line:rgba(42,36,32,.18);--gold:#c9a46a}
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(ellipse 80% 60% at 50% 18%,rgba(232,213,176,.4),transparent 60%),var(--paper);color:var(--ink);font-family:"Noto Serif TC",serif}
body{padding:22px 16px 64px}
.wrap{max-width:640px;margin:0 auto}
.kicker{font-size:11px;letter-spacing:.16em;color:var(--muted);margin:0 0 8px}
h1{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:32px;margin:0 0 8px}
.lead{color:var(--muted);line-height:1.65;margin:0 0 18px}
.panel{background:rgba(255,252,248,.78);border:1px solid var(--line);border-radius:18px;padding:18px 16px;margin:0 0 14px}
.step{font-size:12px;letter-spacing:.12em;color:var(--muted);margin:0 0 8px}
h2{font-size:20px;font-weight:500;margin:0 0 8px}
.how{margin:0 0 12px;font-size:15px;line-height:1.5;color:#5c4030;background:rgba(201,164,106,.18);border-radius:10px;padding:10px 12px}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin:0 0 10px;padding:14px 14px;border-radius:14px;border:2px solid #c9a46a;background:#fff;font:500 17px/1.35 "Noto Serif TC",serif;color:#2a2420;-webkit-appearance:none;appearance:none;min-height:52px;cursor:pointer}
.opt .n{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:#2a2420;color:#f7f1e8;font-size:13px;display:flex;align-items:center;justify-content:center}
.opt .t{flex:1}
.opt .go{color:#8a6a32;font-size:18px}
.opt.on{background:rgba(201,164,106,.22)}
.stage{position:relative;height:360px;border-radius:18px;overflow:hidden;background:radial-gradient(ellipse at 50% 42%,#1a1620,#0e0c12);touch-action:none}
canvas{position:absolute;inset:0;width:100%;height:100%}
.hint{position:absolute;left:0;right:0;top:46%;text-align:center;color:rgba(240,226,196,.7);pointer-events:none}
.seal{margin-top:12px;width:100%;height:48px;border:0;border-radius:999px;background:linear-gradient(180deg,#f0e2c4,#c9a46a);font:inherit;letter-spacing:.12em;color:#2a2420}
.seal:disabled{opacity:.4}
.card h3{font-family:"Cormorant Garamond",serif;font-size:28px;margin:6px 0}
.id{letter-spacing:.14em;color:var(--muted);font-size:13px}
.fig{width:140px;height:180px;margin:8px auto;position:relative}
.fig i{position:absolute;left:50%;border-radius:50%;transform:translateX(-50%);background:radial-gradient(circle,rgba(255,248,232,.8),rgba(201,164,106,.15) 70%,transparent)}
.fig .h{top:8px;width:54px;height:54px}
.fig .b{top:58px;width:78px;height:108px;border-radius:40px}
.row{display:flex;gap:8px;margin-top:12px}
.ghost{flex:1;height:40px;border-radius:999px;border:1px solid var(--line);background:transparent;font:inherit}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <p class="kicker">AE · DREAM GIVER · DEMO</p>
  <h1>先收成一張卡，再走出一個人物</h1>
  <p class="lead">三個回答收成卡。卡接上這一瞬的光痕。收光之後，留下人物和 ID。</p>
  <div id="ask" class="panel">
    <p class="step" id="stepLabel">1 / 3</p>
    <h2 id="q">最近最牽動你的是什麼？</h2>
    <p class="how" id="how">點下面其中一個。點了就到下一題，不用另外按下一步。</p>
    <div id="opts"></div>
  </div>
  <div id="card" class="panel hidden">
    <p class="step">卡片</p>
    <h2 id="cardTitle">這一張先留下</h2>
    <p id="cardBody"></p>
    <button class="seal" id="toLight">接上 Lightprint</button>
  </div>
  <div id="light" class="panel hidden">
    <p class="step">Lightprint</p>
    <h2>留下光痕，再收光</h2>
    <p class="how">用手指在下面畫一下。畫完，「收光」會亮。</p>
    <div class="stage" id="stage"><canvas id="cv"></canvas><p class="hint" id="hint">單指畫過</p></div>
    <button class="seal" id="seal" disabled>收光</button>
  </div>
  <div id="born" class="panel card hidden">
    <p class="step">人物</p>
    <div class="fig" id="fig"><i class="h"></i><i class="b"></i></div>
    <h3 id="name">柔金守夜人</h3>
    <p class="id" id="pid">LP-</p>
    <p id="lore"></p>
    <div class="row"><button class="ghost" id="again">再走一次</button></div>
  </div>
</div>
<script>
const QS = [
  {q:'最近最牽動你的是什麼？', opts:['一件還沒放下的事','一個想靠近的人','一個想走的方向'], how:'點下面其中一個。點了就到下一題，不用另外按下一步。'},
  {q:'它現在更像哪一種？', opts:['遇到了阻礙','正在發生','想把它留下'], how:'再點一個。點了就到最後一題。'},
  {q:'這一瞬靠近哪一種光？', opts:['柔金','靜藍','霧青'], how:'點一種光。點了就收成卡片。'}
];
const NAMES = {柔金:['柔金守夜人','燭心旅人'],靜藍:['月藍靜影','深靛聽夜者'],霧青:['霧青呼吸','露邊的人影']};
let i=0, answers=[], pts=[], mood='柔金';
const $=id=>document.getElementById(id);
function show(id){['ask','card','light','born'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}
function renderQ(){
  $('stepLabel').textContent=(i+1)+' / 3';
  $('q').textContent=QS[i].q;
  $('how').textContent=QS[i].how;
  $('opts').innerHTML='';
  QS[i].opts.forEach((t,n)=>{
    const b=document.createElement('button');
    b.className='opt';
    b.type='button';
    b.setAttribute('aria-label','選擇：'+t);
    b.innerHTML='<span class="n">'+(n+1)+'</span><span class="t"></span><span class="go">›</span>';
    b.querySelector('.t').textContent=t;
    b.onclick=()=>pick(t);
    $('opts').appendChild(b);
  });
}
function pick(t){answers.push(t);if(i<2){i++;renderQ();return}mood=answers[2];$('cardBody').textContent=answers[0]+'。'+answers[1]+'。這一瞬靠近'+mood+'。';show('card')}
function hash(s){let h=2166136261;for(let c of s){h^=c.codePointAt(0);h=Math.imul(h,16777619)}return h>>>0}
function idOf(seed){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let x=hash(seed),o='LP-';for(let n=0;n<8;n++){x=Math.imul(x^n,0x45d9f3b);o+=a[(x>>>0)%a.length]}return o}
const cv=$('cv'),ctx=cv.getContext('2d');
function fit(){const r=$('stage').getBoundingClientRect();cv.width=r.width;cv.height=r.height}
fit();addEventListener('resize',fit);
function dot(x,y){const g=ctx.createRadialGradient(x,y,0,x,y,36);g.addColorStop(0,'rgba(240,226,196,.55)');g.addColorStop(1,'rgba(240,226,196,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,36,0,7);ctx.fill();pts.push([x/cv.width,y/cv.height]);$('hint').style.opacity=0;$('seal').disabled=pts.length<2}
let drawing=false;
cv.onpointerdown=e=>{drawing=true;const r=cv.getBoundingClientRect();dot(e.clientX-r.left,e.clientY-r.top)};
cv.onpointermove=e=>{if(!drawing)return;const r=cv.getBoundingClientRect();dot(e.clientX-r.left,e.clientY-r.top)};
addEventListener('pointerup',()=>drawing=false);
$('toLight').onclick=()=>show('light');
$('seal').onclick=()=>{
  const seed=JSON.stringify({answers,mood,n:pts.length});
  const id=idOf(seed);
  const name=NAMES[mood][hash(seed)%2];
  $('name').textContent=name;$('pid').textContent=id;
  $('lore').textContent='卡上記著「'+answers[0]+'」。光痕收成'+mood+'，人物以此為 ID。';
  $('fig').style.filter=mood==='靜藍'?'hue-rotate(190deg)':'hue-rotate('+(mood==='霧青'?80:0)+'deg)';
  localStorage.setItem('ae-lp-demo',JSON.stringify({id,name,answers,mood}));
  show('born');
};
$('again').onclick=()=>{i=0;answers=[];pts=[];ctx.clearRect(0,0,cv.width,cv.height);$('seal').disabled=true;$('hint').style.opacity=1;renderQ();show('ask')};
const saved=localStorage.getItem('ae-lp-demo');
if(saved){$('lead').textContent+=' 上次留下 '+JSON.parse(saved).id+'。'}
renderQ();
</script>
</body>
</html>
